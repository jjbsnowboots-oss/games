<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backdrop Lab</title>
<style>
*{box-sizing:border-box}
:root{--bg:#e9eef0;--panel:#fff;--ink:#14202b;--mut:#587083;--line:#d5dee3;--acc:#0f766e;--onacc:#fff;--chip:#f0f4f5;--sh:0 10px 30px rgba(20,40,60,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1217;--panel:#141e26;--ink:#e6eef3;--mut:#8aa0b0;--line:#25333e;--acc:#2dd4bf;--onacc:#06231f;--chip:#1b2832;--sh:0 10px 30px rgba(0,0,0,.4)}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;gap:14px;align-items:center;padding:18px 24px 4px;max-width:1500px;margin:auto}
.logo{width:44px;height:40px;flex:none;background:linear-gradient(135deg,var(--acc),#7c3aed);border-radius:58% 42% 55% 45%/48% 58% 42% 52%}
h1{font:600 25px/1.1 ui-serif,Georgia,serif;margin:0}
header p{margin:3px 0 0;color:var(--mut);font-size:13.5px}
main{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;padding:14px 24px 28px;max-width:1500px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr;padding:12px}}
.frame{display:flex;justify-content:center;align-items:center;background:var(--panel);border-radius:18px;padding:14px;box-shadow:var(--sh)}
canvas{max-width:100%;max-height:66vh;border-radius:8px;display:block}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.sp{flex:1}
.btn{font:inherit;font-weight:600;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--acc)}
.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.seed{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.seed input,select{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.seed input{width:105px}
select{width:100%}
.panel{background:var(--panel);border-radius:18px;padding:4px 18px 8px;box-shadow:var(--sh);align-self:start}
.grp{padding:14px 0;border-bottom:1px solid var(--line)}
.grp:last-child{border:0}
h3{margin:0 0 9px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.sw{width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.5)}
.sl{display:grid;grid-template-columns:1fr auto;margin-top:12px;font-size:13px}
.sl output{color:var(--mut)}
.sl input{grid-column:1/3;width:100%;accent-color:var(--acc);margin:6px 0 0}
.hint{margin:9px 0 0;font-size:13px;color:var(--mut)}
.themebar{max-width:1500px;margin:auto;padding:10px 24px 0}
@media(max-width:900px){.themebar{padding:10px 12px 0}}
.trow{display:flex;gap:10px}
#theme{flex:1;min-width:0;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
#theme:focus{border-color:var(--acc);outline:none}
.qk{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chk{display:flex;gap:9px;align-items:center;margin-bottom:12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header>
  <i class="logo"></i>
  <div><h1>Backdrop Lab</h1><p>Type any theme, get a background for your slides, then save it as a picture.</p></div>
</header>
<div class="themebar">
  <div id="tf" class="trow"><input id="theme" placeholder="Type any theme: moldy, maths, technology, pirates, red volcano…" aria-label="Theme" spellcheck="false" autocomplete="off"><button type="button" id="mk" class="btn pri" style="padding:0 24px">Make it</button></div>
  <div class="qk" id="quick"></div>
  <div class="qk" id="subj"></div>
  <div class="qk" id="topics"></div>
  <p class="hint" id="tmsg">Pick a word or type your own. Spelling doesn’t have to be perfect.</p>
  <div class="qk" id="dym"></div>
</div>
<main>
  <section>
    <div class="frame"><canvas id="cv"></canvas></div>
    <div class="bar">
      <button class="btn pri" id="gen">Generate new</button>
      <button class="btn" id="sur">Surprise me</button>
      <label class="seed">Seed <input id="seed" spellcheck="false" autocomplete="off"></label>
      <span class="sp"></span>
      <button class="btn" id="exp">Save PNG</button>
    </div>
  </section>
  <aside class="panel">
    <div class="grp"><h3>Colour</h3><div class="chips" data-k="mode"></div></div>
    <div class="grp"><h3>Pattern</h3><div class="chips" data-k="pat"></div>
      <label class="sl"><span>Pattern strength</span><output></output><input type="range" min="0" max="100" data-s="sci"></label></div>
    <div class="grp"><h3>Camera lens</h3><div class="chips" data-k="lens"></div><p class="hint" id="hint"></p>
      <label class="sl"><span>Camera blur</span><output></output><input type="range" min="0" max="100" data-s="blur"></label>
      <label class="sl"><span>Vignette</span><output></output><input type="range" min="0" max="100" data-s="vig"></label>
      <label class="sl"><span>Grain</span><output></output><input type="range" min="0" max="100" data-s="grain"></label></div>
    <div class="grp"><h3>Fine tuning</h3>
      <label class="sl"><span>Colour shift</span><output></output><input type="range" min="-180" max="180" data-s="shift"></label>
      <label class="sl"><span>Pattern size</span><output></output><input type="range" min="50" max="200" data-s="psize"></label>
      <label class="sl"><span>Blob amount</span><output></output><input type="range" min="0" max="8" data-s="bl"></label>
      <select id="size" aria-label="Picture size" style="margin-top:16px">
        <option value="1920x1080">1920×1080 (16:9 slide)</option>
        <option value="1280x720">1280×720 (16:9, smaller)</option>
        <option value="2560x1440">2560×1440 (16:9, large)</option>
        <option value="1600x1200">1600×1200 (4:3 slide)</option>
        <option value="1080x1080">1080×1080 (square)</option>
      </select></div>
  </aside>
</main>
<script>
const $=s=>document.querySelector(s);
const S={mode:'dark',pat:'molecules',lens:'macro',sci:35,blur:45,vig:35,grain:30,bl:4,shift:0,psize:100,size:'1920x1080',seed:'',hue:null,light:null,pat2:null,word:''};
const newSeed=()=>Math.random().toString(36).slice(2,8);
const PAL={
 dark:{c:['#0a111c','#14233b','#1b3a5a'],a:'#5eead4',i:'#9fe8ff',d:1},
 black:{c:['#000000','#0b0b0b','#1a1a1a'],a:'#9a9a9a',i:'#dedede',d:1},
 light:{c:['#f7f9fc','#e6edfb','#dcf2ec'],a:'#3b82f6',i:'#2b4a6f',d:0},
 moldy:{c:['#0d160c','#1e3a1c','#3a5a22'],a:'#b6e04a',i:'#d4f08a',d:1},
 chem:{c:['#150d2b','#34176b','#0f4c75'],a:'#f0abfc',i:'#e9d5ff',d:1},
 space:{c:['#04050e','#171248','#3b0f5e'],a:'#93c5fd',i:'#dbeafe',d:1},
 plants:{c:['#0d261b','#14532d','#3f6212'],a:'#bef264',i:'#d9f99d',d:1},
 ocean:{c:['#03202e','#0a4d6a','#0e7490'],a:'#67e8f9',i:'#cffafe',d:1},
 neon:{c:['#07040f','#1a0b3a','#0b2a4a'],a:'#22d3ee',i:'#f0abfc',d:1},
 sunset:{c:['#1f0a1e','#7a1f4a','#c2410c'],a:'#fbbf24',i:'#ffe4c7',d:1},
 pastel:{c:['#fdf4ff','#e0f2fe','#fce7f3'],a:'#a78bfa',i:'#6d5a9a',d:0},
 sepia:{c:['#f3e9d6','#e6d3ac','#d5b98a'],a:'#b45309',i:'#5a3a1a',d:0},
 fire:{c:['#0c0605','#3a0d06','#7a1d06'],a:'#fb923c',i:'#fed7aa',d:1},
 ice:{c:['#f1f8ff','#d8ecfb','#c4e3f6'],a:'#38bdf8',i:'#1e4f73',d:0},
 royal:{c:['#120a24','#2b1655','#4a2a7a'],a:'#fbbf24',i:'#fde68a',d:1},
 war:{c:['#15170f','#2d3022','#4a4d35'],a:'#b3261e',i:'#dcd6b6',d:1},
 blueprint:{c:['#06223d','#0a3a63','#0f4f86'],a:'#7cc4ff',i:'#d6ecff',d:1},
 timber:{c:['#1c120a','#3b2414','#5c3a1e'],a:'#d9a066',i:'#f1d9b5',d:1},
 eco:{c:['#0b2a22','#14503f','#2e7d5b'],a:'#e9c46a',i:'#d8f3dc',d:1},
 steel:{c:['#0e1114','#1d242b','#2f3a44'],a:'#9fb3c4',i:'#dfe8ef',d:1},
 maori:{c:['#0c0a0a','#2b0f0f','#5a1414'],a:'#d4452f',i:'#f3ead7',d:1},
 pounamu:{c:['#071a17','#0f3d33','#1f6b58'],a:'#86e0bd',i:'#d9f7ea',d:1}};
const O={
 mode:[['dark','Dark'],['black','Black'],['light','Light'],['random','Random'],['moldy','Moldy'],['chem','Chemistry'],['space','Space'],['plants','Plants'],['ocean','Ocean'],['neon','Neon'],['sunset','Sunset'],['pastel','Pastel'],['sepia','Sepia'],['fire','Fire'],['ice','Ice'],['royal','Royal'],['maori','Māori'],['war','Khaki'],['blueprint','Blueprint'],['timber','Timber'],['steel','Steel'],['eco','Eco green'],['pounamu','Pounamu']],
 pat:[['molecules','Molecules'],['dna','DNA'],['atoms','Atoms'],['circuits','Circuits'],['graph','Graph paper'],['cells','Cells'],['math','Maths'],['network','Network'],['binary','Binary code'],['koru','Koru'],['poutama','Poutama'],['gears','Gears'],['stars','Stars'],['waves','Waves'],['leaves','Leaves'],['notes','Music'],['shapes','Shapes'],['confetti','Confetti'],['trail','Trail'],['contours','Contours'],['searchlights','Searchlights'],['rays','Sunrise rays'],['aperture','Camera'],['compass','Compass'],['poppies','Poppies'],['pages','Pages'],['invent','Word art'],['mixed','Mixed'],['none','None']],
 lens:[['none','None'],['wide','Wide'],['macro','Macro'],['micro','Microscope'],['portrait','Portrait']]};
const SW={dark:'#1b3a5a',black:'#000',light:'#e6edfb',random:'conic-gradient(#f43f5e,#f59e0b,#10b981,#3b82f6,#a855f7,#f43f5e)',moldy:'#3a5a22',chem:'#34176b',space:'#3b0f5e',plants:'#14532d',ocean:'#0e7490',neon:'linear-gradient(135deg,#22d3ee,#a855f7)',sunset:'linear-gradient(135deg,#7a1f4a,#fbbf24)',pastel:'#e0c3fc',sepia:'#d5b98a',fire:'#c2410c',ice:'#c4e3f6',royal:'#4a2a7a',maori:'linear-gradient(135deg,#0c0a0a 45%,#d4452f)',war:'#4a4d35',blueprint:'#0f4f86',timber:'#5c3a1e',steel:'#2f3a44',eco:'#2e7d5b',pounamu:'#1f6b58'};
const H={none:'Flat and graphic, with no camera effects.',wide:'Crisp all over, with soft light from above.',macro:'Close-up look: sharp in the middle, soft towards the edges.',micro:'Round microscope view with a dark rim.',portrait:'Whole background softly blurred, with glowing bokeh circles.'};

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rngOf(seed){let a=hash(seed);return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hx(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return'#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
const al=(c,a)=>c+Math.round(a*255).toString(16).padStart(2,'0');
const mk=(w,h)=>{const e=document.createElement('canvas');e.width=w;e.height=h;return e};
const dot=(a,x,y,r)=>{a.beginPath();a.arc(x,y,r,0,6.283);a.fill()};

function h2s(c){const r=parseInt(c.slice(1,3),16)/255,g=parseInt(c.slice(3,5),16)/255,b=parseInt(c.slice(5,7),16)/255,M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2,d=M-m;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=(M===r?((g-b)/d+6)%6:M===g?(b-r)/d+2:(r-g)/d+4)*60}return[h,s*100,l*100]}
function shiftP(P,k){const f=c=>{const[h,s,l]=h2s(c);return hx(h+k,s,l)};return{c:P.c.map(f),a:f(P.a),i:f(P.i),d:P.d}}
function pal(rng){const P=pal0(rng);return S.shift?shiftP(P,S.shift):P}
function pal0(rng){
 if(S.mode!=='random')return PAL[S.mode];
 const r0=rng(),h=S.hue==null?r0*360:S.hue,h2=h+40+rng()*60,dk0=rng()<.7,dk=S.light==null?dk0:!S.light;
 return dk?{c:[hx(h,45,10),hx(h2,50,20),hx(h,55,30)],a:hx(h+170,80,65),i:hx(h,90,85),d:1}
  :{c:[hx(h,40,97),hx(h2,60,92),hx(h,60,88)],a:hx(h,70,50),i:hx(h,50,25),d:0};
}
function base(a,W,H,rng,P){
 a.fillStyle=P.c[0];a.fillRect(0,0,W,H);
 for(let i=0;i<6;i++){
  const x=rng()*W,y=rng()*H,r=W*(.3+rng()*.35),acc=i%3==2,col=acc?P.a:P.c[1+i%2],g=a.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,al(col,acc?.28:.9));g.addColorStop(1,al(col,0));a.fillStyle=g;a.fillRect(0,0,W,H);
 }
}
function blobs(a,W,H,rng,P){
 const n=S.bl;
 for(let i=0;i<n;i++){
  const cx=rng()*W,cy=rng()*H,r=W*(.08+rng()*.14),k=7+(rng()*4|0),p=[];
  for(let j=0;j<k;j++){const t=j/k*6.2832,q=r*(.7+rng()*.55);p.push([cx+Math.cos(t)*q,cy+Math.sin(t)*q])}
  const m=(u,v)=>[(u[0]+v[0])/2,(u[1]+v[1])/2],s=m(p[k-1],p[0]);
  a.beginPath();a.moveTo(s[0],s[1]);
  for(let j=0;j<k;j++){const e=m(p[j],p[(j+1)%k]);a.quadraticCurveTo(p[j][0],p[j][1],e[0],e[1])}
  const g=a.createLinearGradient(cx-r,cy-r,cx+r,cy+r);g.addColorStop(0,al(P.a,.34));g.addColorStop(1,al(P.c[2],.2));
  a.fillStyle=g;a.fill();
 }
}
function mold(a,W,H,rng,P,u){
 const n=4+Math.round(S.sci/100*12);
 for(let i=0;i<n;i++){
  const x=rng()*W,y=rng()*H,r=(40+rng()*120)*u,g=a.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,al(P.a,.3));g.addColorStop(.7,al(P.a,.1));g.addColorStop(1,al(P.a,0));
  a.fillStyle=g;dot(a,x,y,r);
  for(let j=0;j<30;j++){const t=rng()*6.283,d=r*Math.sqrt(rng())*.9;a.fillStyle=al(P.i,.12+rng()*.3);dot(a,x+Math.cos(t)*d,y+Math.sin(t)*d,(1.5+rng()*4)*u)}
 }
}
function molecules(a,W,H,rng,u,n,P,al0){
 for(let m=0;m<n;m++){
  const nd=[[rng()*W,rng()*H,null]],k=4+(rng()*5|0);
  for(let i=1;i<k;i++){const p=nd[rng()*nd.length|0],t=rng()*6.283,d=(70+rng()*60)*u;nd.push([p[0]+Math.cos(t)*d,p[1]+Math.sin(t)*d,p])}
  a.beginPath();nd.forEach(q=>{if(q[2]){a.moveTo(q[2][0],q[2][1]);a.lineTo(q[0],q[1])}});a.stroke();
  nd.forEach(q=>dot(a,q[0],q[1],(7+rng()*12)*u));
  if(rng()<.5){const x=rng()*W,y=rng()*H,r=(50+rng()*40)*u;a.beginPath();for(let i=0;i<6;i++){const t=i*1.0472+.5236;a.lineTo(x+Math.cos(t)*r,y+Math.sin(t)*r)}a.closePath();a.stroke()}
 }
}
function dna(a,W,H,rng,u,n){
 for(let m=0;m<n;m++){
  const len=W*(.3+rng()*.35),A=42*u,wl=(130+rng()*70)*u;
  a.save();a.translate(rng()*W,rng()*H);a.rotate(rng()*3.14);
  for(let s=0;s<2;s++){a.beginPath();for(let x=0;x<=len;x+=5*u){const y=Math.sin(x/wl*6.283+s*3.1416)*A;x?a.lineTo(x,y):a.moveTo(x,y)}a.stroke()}
  for(let x=0;x<=len;x+=wl/8){const y=Math.sin(x/wl*6.283)*A;a.beginPath();a.moveTo(x,y);a.lineTo(x,-y);a.stroke();dot(a,x,y,3*u);dot(a,x,-y,3*u)}
  a.restore();
 }
}
function atoms(a,W,H,rng,u,n){
 for(let m=0;m<n;m++){
  const x=rng()*W,y=rng()*H,R=(60+rng()*80)*u,rot=rng()*3.14;
  for(let k=0;k<3;k++){
   const th=rot+k*1.0472;a.beginPath();a.ellipse(x,y,R,R*.34,th,0,6.283);a.stroke();
   const t=rng()*6.283,ex=R*Math.cos(t),ey=R*.34*Math.sin(t);
   dot(a,x+ex*Math.cos(th)-ey*Math.sin(th),y+ex*Math.sin(th)+ey*Math.cos(th),5*u);
  }
  dot(a,x,y,9*u);
 }
}
function circuits(a,W,H,rng,u,n){
 for(let m=0;m<n*3;m++){
  let x=rng()*W,y=rng()*H,d=rng()*4|0;const s=[[x,y]];
  for(let i=0,k=3+(rng()*4|0);i<k;i++){const l=(50+rng()*160)*u;x+=[1,0,-1,0][d]*l;y+=[0,1,0,-1][d]*l;s.push([x,y]);d=(d+(rng()<.5?1:3))%4}
  a.beginPath();s.forEach((p,i)=>i?a.lineTo(p[0],p[1]):a.moveTo(p[0],p[1]));a.stroke();
  [s[0],s[s.length-1]].forEach(p=>{a.beginPath();a.arc(p[0],p[1],6*u,0,6.283);a.stroke();dot(a,p[0],p[1],2.2*u)});
 }
}
function graph(a,W,H,rng,u,n,P,al0){
 const s=48*u;a.globalAlpha=al0*.45;a.lineWidth=Math.max(.6,u);a.beginPath();
 for(let x=0;x<W;x+=s){a.moveTo(x,0);a.lineTo(x,H)}
 for(let y=0;y<H;y+=s){a.moveTo(0,y);a.lineTo(W,y)}
 a.stroke();a.lineWidth=Math.max(1,2.2*u);a.globalAlpha=al0;
 for(let m=0;m<Math.ceil(n/2);m++){
  const w=(300+rng()*300)*u,h=(180+rng()*150)*u,x=rng()*(W-w),y=rng()*(H-h),k=8,pts=[];let py=.8;
  a.beginPath();a.moveTo(x,y);a.lineTo(x,y+h);a.lineTo(x+w,y+h);a.stroke();
  for(let i=0;i<=k;i++){py=Math.max(.05,Math.min(.95,py-.08-(rng()-.45)*.15));pts.push([x+i/k*w,y+py*h])}
  a.beginPath();pts.forEach((p,i)=>i?a.lineTo(p[0],p[1]):a.moveTo(p[0],p[1]));a.stroke();
  pts.forEach(p=>dot(a,p[0],p[1],4*u));
  for(let i=1;i<k;i++){a.beginPath();a.moveTo(x+i/k*w,y+h);a.lineTo(x+i/k*w,y+h+8*u);a.stroke()}
 }
}
function cells(a,W,H,rng,u,n,P,al0){
 for(let m=0;m<n*3;m++){
  const x=rng()*W,y=rng()*H,r=(30+rng()*80)*u;
  a.beginPath();a.arc(x,y,r,0,6.283);a.stroke();
  a.beginPath();a.arc(x+(rng()-.5)*r*.4,y+(rng()-.5)*r*.4,r*.32,0,6.283);a.globalAlpha=al0*.5;a.fill();a.globalAlpha=al0;a.stroke();
  for(let i=0;i<4;i++){const t=rng()*6.283,d=r*(.5+rng()*.35);dot(a,x+Math.cos(t)*d,y+Math.sin(t)*d,r*.07)}
 }
